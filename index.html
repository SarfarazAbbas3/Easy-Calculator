/* Layout: phone app shell. Sticky header, scrolling content, fixed bottom tab bar. Tools open as full screens from a launcher grid. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface2:#E8ECF5; --ink:#141C33; --muted:#59647F; --line:#DCE1EC;
  --accent:#2F4FB3; --accent-ink:#FFFFFF; --accent-soft:#E1E8FA;

  --bg:#0D1322; --surface:#162038; --surface2:#1F2B49; --ink:#E7EBF6; --muted:#98A4C2; --line:#2A3658;
  --accent:#8AA2F2; --accent-ink:#0D1322; --accent-soft:#233059;

  --c-test:#8FA7F5; --c-fab:#F08A9B; --c-yarn:#58C6B0; --c-tool:#E3B35A; --warn:#F0A06A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#162038; --surface2:#1F2B49; --ink:#E7EBF6; --muted:#98A4C2; --line:#2A3658;
  --accent:#8AA2F2; --accent-ink:#0D1322; --accent-soft:#233059;
  --hero:#26397A; --hero-ink:#FFFFFF; --hero-mut:#C2CCF2;
  --c-test:#8FA7F5; --c-fab:#F08A9B; --c-yarn:#58C6B0; --c-tool:#E3B35A; --warn:#F0A06A; color-scheme:dark}
*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:520px;margin:0 auto;position:relative;z-index:1}

.rh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}

  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

.credit a.fb{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.credit a.wa{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent);padding:8px 12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.card,.tile,.search{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
/* motion */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.tile{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.view-in{animation:inr .28s cubic-bezier(.2,.8,.2,1) both}
.view-fade{animation:fade .25s ease both}
.panel:not([hidden]){animation:up .32s cubic-bezier(.2,.8,.2,1) both}
.tool{animation:none!important}
.hero.flash{animation:flash .55s ease-out}
.chip.new,.rrow.new,.sv{animation:pop .32s ease both}
button{transition:transform .12s,background-color .2s,color .2s}
button:active{transform:scale(.97)}
body,.card,.tile,.fw,.seg,.rows2,.ib,nav.tabs,.act{transition:background-color .3s,border-color .3s,color .3s}
nav.tabs button svg{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.1)}
#fav.on{color:var(--c-tool)}#fav.on svg{fill:var(--c-tool);animation:pop .35s ease}
.rlist{display:grid;gap:10px}
.act{display:grid;justify-items:center;gap:4px;padding:11px 4px;border-radius:13px;background:var(--surface2);font-size:12.5px;font-weight:500;min-width:0}
.act svg{width:20px;height:20px}
.act.pri{background:var(--accent);color:var(--accent-ink)}
.fw input.txt{font-family:var(--sans);font-size:16px;font-weight:400}
.fw.ta{height:auto;padding:10px 14px}
.fw.ta textarea{width:100%;min-height:96px;border:0;background:none;outline:0;resize:vertical;font-family:var(--mono);font-size:16px;color:var(--ink);line-height:1.5}
.svh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.svh b{font-size:16px;font-weight:600}.svh span{font-size:12px;color:var(--muted);white-space:nowrap}
.svn{font-size:13.5px;color:var(--accent);font-weight:500;margin-top:-6px}
.fld .seg{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[data-anim="off"] *{transition:none!important;animation:none!important}
@media (max-width:360px){.hv{font-size:26px}.rrow{grid-template-columns:18px 1fr 1fr 70px 28px;gap:6px}}
</style>

function numField(c,key,label,unit,def){

function seg(c,key,opts,def,cb){
  var w=el('div','seg');w.setAttribute('role','tablist');
  function cur(){return c.v[key]!=null?c.v[key]:def}
  function sync(){Array.prototype.forEach.call(w.children,function(b){var on=b.dataset.v===cur();b.classList.toggle('on',on);b.setAttribute('aria-selected',on)})}
  opts.forEach(function(o){
    var b=el('button','',o[1]);b.type='button';b.dataset.v=o[0];b.setAttribute('role','tab');
    b.onclick=function(){buzz(8);c.v[key]=o[0];c.save();sync();if(cb)cb();c.run()};

function modes(c,key,list,def,root){

        else w._s[it.l]=tgt;

      var r=el('button','rr');r.type='button';

tool('shrink','Shrinkage & Skewness','Warp, weft and skew from measurements','test','shrink',function(c,root){
  function rowsCard(key,title,def){
    var card=sec(title),head=el('div','rhead','<span>#</span><span>Before cm</span><span>After cm</span><span style="text-align:right">Change %</span><span></span>');
    var list=el('div','rlist'),add=el('button','ghost','+ Add observation');add.type='button';

    function sg(x){return isFinite(x)?(x>0?'+':'')+fmt(x,2):'—'}
    var outs=[];
    function calc(){
      var vals=[];
      rows().forEach(function(r,i){var p=pc(r);if(outs[i])outs[i].textContent=sg(p);if(isFinite(p))vals.push(p)});
      var m=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:NaN;

  });
});

/* Statistics */
tool('stats','Statistics','Mean, SD, CV% and 95% interval','tool','stats',function(c,root){
  var card=sec('Readings','Type or paste numbers separated by space, comma or new line.');
  var w=el('label','fld');
  w.innerHTML='<span class="fl">Values</span><span class="fw ta"><textarea id="'+c.id+'-txt" rows="4" autocomplete="off" spellcheck="false"></textarea></span>';
  var ta=$('textarea',w);ta.value=c.v.txt!=null?c.v.txt:'61.1, 58.4, 63.0, 60.2, 59.7';c.inp.txt=ta;
  ta.addEventListener('input',function(){c.v.txt=ta.value;c.changed()});
  var res=resBox();card.append(w,res);root.append(card);
  var T=[12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.160,2.145,2.131,2.120,2.110,2.101,2.093,2.086,2.080,2.074,2.069,2.064,2.060,2.056,2.052,2.048,2.045];
  c.upd.push(function(){
    var a=ta.value.split(/[\s,;]+/).map(parseFloat).filter(function(x){return isFinite(x)}),n=a.length;
    if(!n){res.set([{h:'Enter at least one number'}]);return}
    var m=a.reduce(function(s,x){return s+x},0)/n;
    var sd=n>1?Math.sqrt(a.reduce(function(s,x){return s+(x-m)*(x-m)},0)/(n-1)):NaN;
    var s=a.slice().sort(function(p,q){return p-q}),med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
    var t=n>1?(n-1<=29?T[n-2]:1.96):NaN,ci=t*sd/Math.sqrt(n);
    res.set([
      {big:1,l:'Mean',v:m},{big:1,l:'CV',v:sd/m*100,u:'%'},
      {l:'Readings',v:n,d:0},{l:'Std deviation',v:sd},{l:'Median',v:med},
      {l:'Min',v:s[0]},{l:'Max',v:s[n-1]},{l:'Range',v:s[n-1]-s[0]},
      {l:'95% interval',v:isFinite(ci)?'± '+fmt(ci):'—'}
    ]);
  });
});

/* ---- snapshots, reports, saved ---- */
function fdate(ts){var d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function snapshot(c,t,note){
  var inputs=[],results=[];
  Object.keys(c.inp).forEach(function(k){
    var e=c.inp[k];if(e.offsetParent===null)return;
    var lab=e.closest('label'),sc=e.closest('section'),h=sc&&$('h3',sc),fl=lab&&$('.fl',lab),fu=lab&&$('.fu',lab);
    inputs.push([(h?h.textContent+' · ':'')+(fl?fl.textContent:k),e.value,fu?fu.textContent:'']);
  });
  if(t.id==='shrink')['warp','weft'].forEach(function(k){(c.v[k]||[]).forEach(function(r,i){inputs.push([k+' '+(i+1)+' before → after',r[0]+' → '+r[1],'cm'])})});
  CUR.boxes.forEach(function(w){
    if(w.offsetParent===null)return;
    (w.items||[]).forEach(function(it){
      if(it.skip)return;
      if(it.h){results.push([it.h,'','',0]);return}
      if(it.w){results.push([it.w,'','',0]);return}
      results.push([it.l,itxt(it),it.u||'',it.big?1:0]);
    });
  });
  return {id:t.id,name:t.name,t:Date.now(),note:note||'',inputs:inputs,results:results,v:JSON.parse(JSON.stringify(c.v))};
}
function reportText(s){
  var L=['Easy Cal · '+s.name];if(s.note)L.push('Sample: '+s.note);
  L.push(fdate(s.t),'','Inputs');
  s.inputs.forEach(function(x){L.push('  '+x[0]+': '+x[1]+(x[2]?' '+x[2]:''))});
  L.push('','Results');
  s.results.forEach(function(x){L.push(x[1]===''?'  '+x[0]:'  '+x[0]+': '+x[1]+(x[2]?' '+x[2]:''))});
  L.push('','Easy Cal by Sarfaraz Abbas');return L.join('\n');
}

/* ---- animated background: drifting yarn lines ---- */
var bgc=$('#bg'),bgx=bgc.getContext&&bgc.getContext('2d'),bgRaf=0,bgT=0,bgW=0,bgH=0,bgCol='47,79,179',bgLast=0;
function bgColor(){
  var a=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),m;
  if(m=/^#([0-9a-f]{6})$/i.exec(a))bgCol=[0,2,4].map(function(i){return parseInt(m[1].substr(i,2),16)}).join(',');
}
function bgSize(){
  var d=Math.min(window.devicePixelRatio||1,2);bgW=innerWidth;bgH=innerHeight;
  bgc.width=bgW*d;bgc.height=bgH*d;bgx.setTransform(d,0,0,d,0,0);
}
function bgDraw(now){
  bgRaf=requestAnimationFrame(bgDraw);
  if(now-bgLast<33)return;bgLast=now;bgT+=0.012;
  var dark=isDark(),al=dark?0.34:0.28,N=9;
  bgx.clearRect(0,0,bgW,bgH);
  bgx.lineWidth=1.8;
  for(var i=0;i<N;i++){
    var y0=bgH*(i+0.5)/N,amp=18+(i%3)*12,f=0.006+(i%4)*0.0016,sp=(i%2?1:-1)*(0.7+i*0.12),ph=i*1.7;
    bgx.strokeStyle='rgba('+bgCol+','+(al*(0.5+0.5*Math.sin(bgT*0.6+i)))+')';
    bgx.beginPath();
    for(var x=-10;x<=bgW+10;x+=12){
      var y=y0+amp*Math.sin(x*f+bgT*sp+ph)+amp*0.4*Math.sin(x*f*2.3-bgT*sp*0.8);
      if(x===-10)bgx.moveTo(x,y);else bgx.lineTo(x,y);
    }
    bgx.stroke();
  }
  /* faint warp threads */
  bgx.lineWidth=1;
  for(var k=0;k<6;k++){
    var x0=bgW*(k+0.5)/6+Math.sin(bgT*0.5+k)*10;
    bgx.strokeStyle='rgba('+bgCol+','+(al*0.35)+')';
    bgx.beginPath();bgx.moveTo(x0,0);bgx.lineTo(x0+Math.sin(bgT*0.4+k*2)*14,bgH);bgx.stroke();
  }
}
function bgSync(){
  if(!bgx)return;
  var on=S.anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!document.hidden;
  cancelAnimationFrame(bgRaf);bgRaf=0;
  if(on){bgColor();bgSize();bgRaf=requestAnimationFrame(bgDraw)}
  else{bgx.clearRect(0,0,bgc.width,bgc.height)}
}
addEventListener('resize',function(){if(bgRaf)bgSize()});
document.addEventListener('visibilitychange',bgSync);
